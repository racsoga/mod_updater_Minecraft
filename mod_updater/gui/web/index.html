<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mod Updater</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- Los textos se rellenan desde locales/<idioma>.json: data-i18n (texto), data-i18n-placeholder,
     data-i18n-title, data-i18n-aria-label. -->
<div class="app">
  <header class="topbar">
    <h1 class="brand"><img class="brand-logo" src="logo.svg" alt="" width="32" height="32">Mod Updater</h1>
    <span class="spacer"></span>
    <!-- Hueco para el selector de perfil (hito 5 del plan v3). -->
    <span id="profile-slot" hidden>
      <label class="sr-only" for="profile-select" data-i18n="profile.select"></label>
      <select class="select profile-select" id="profile-select"></select>
    </span>
    <span class="chip hide-sm" id="chip-folder" hidden></span>
    <span class="chip" id="chip-env" hidden></span>
    <button class="navbtn" type="button" id="btn-rescan" hidden data-i18n-aria-label="ui.rescan">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2a6 6 0 1 0 5.66 8h-1.6A4.5 4.5 0 1 1 8 3.5c1.24 0 2.37.5 3.18 1.32L9 7h5V2l-1.76 1.76A5.98 5.98 0 0 0 8 2Z"/></svg>
      <span class="label" data-i18n="ui.rescan"></span>
    </button>
  </header>

  <!-- Secciones de la app. Análisis, Explorar y Sugerencias se añaden en sus hitos. -->
  <div class="tabs" id="tabs" role="tablist" data-i18n-aria-label="ui.tabs_label" hidden>
    <button class="tab" type="button" role="tab" id="tab-mods" data-tab="mods" aria-selected="true" data-i18n="ui.tab_mods"></button>
    <button class="tab" type="button" role="tab" id="tab-analysis" data-tab="analysis" aria-selected="false" tabindex="-1" data-i18n="ui.tab_analysis"></button>
    <button class="tab" type="button" role="tab" id="tab-explore" data-tab="explore" aria-selected="false" tabindex="-1" data-i18n="ui.tab_explore"></button>
    <button class="tab" type="button" role="tab" id="tab-settings" data-tab="settings" aria-selected="false" tabindex="-1" data-i18n="ui.settings"></button>
  </div>

  <!-- ============================================ Bienvenida / Ajustes -->
  <section class="screen" id="screen-setup" hidden>
    <div class="lede">
      <h2 id="setup-title"></h2>
      <p id="setup-deck"></p>
    </div>
    <section class="panel profiles-panel" id="profiles-panel" aria-labelledby="profiles-title" hidden>
      <div class="field">
        <h3 class="label" id="profiles-title" data-i18n="profile.panel_title"></h3>
        <p class="help" data-i18n="profile.panel_help"></p>
        <ul class="prof-list" id="prof-list"></ul>
        <p class="help bad" id="prof-warn" hidden></p>
        <div class="row-inline prof-add">
          <button class="btn-small" type="button" id="prof-detect" data-i18n="profile.detect"></button>
          <button class="btn-small" type="button" id="prof-folder" data-i18n="profile.add_folder"></button>
        </div>
        <ul class="prof-list prof-found" id="prof-found"></ul>
        <p class="help" id="prof-help" aria-live="polite"></p>
      </div>
      <div class="field">
        <h3 class="label" data-i18n="ml.title"></h3>
        <p class="help" data-i18n="ml.help"></p>
        <div class="row-inline prof-add">
          <button class="btn-small" type="button" id="ml-export" data-i18n="ml.export"></button>
          <button class="btn-small" type="button" id="ml-mrpack" data-i18n="ml.export_mrpack"></button>
          <button class="btn-small" type="button" id="ml-import" data-i18n="ml.import"></button>
          <button class="btn-small" type="button" id="ml-copy" data-i18n="ml.copy"></button>
        </div>
        <div class="row-inline prof-add" id="ml-compare-row">
          <label class="sr-only" for="ml-compare-with" data-i18n="ml.compare_with"></label>
          <select class="select" id="ml-compare-with"></select>
          <button class="btn-small" type="button" id="ml-compare" data-i18n="ml.compare"></button>
        </div>
        <p class="help" id="ml-help" aria-live="polite"></p>
      </div>
    </section>

    <form class="panel" id="setup-form" novalidate>
      <div class="field">
        <span class="label" id="lbl-folder" data-i18n="ui.folder"></span>
        <div class="row-inline">
          <span class="path" id="folder-path" aria-labelledby="lbl-folder"></span>
          <button class="btn-small" type="button" id="btn-folder" data-i18n="ui.change_folder"></button>
        </div>
        <p class="help" id="folder-help" aria-live="polite"></p>
      </div>
      <div class="field">
        <div class="pair">
          <div>
            <label class="label" for="mc-version" data-i18n="ui.mc_version"></label>
            <select class="select" id="mc-version"></select>
          </div>
          <div>
            <label class="label" for="loader" data-i18n="ui.loader"></label>
            <select class="select" id="loader"></select>
          </div>
        </div>
        <p class="help" id="env-help"></p>
      </div>
      <div class="field">
        <div class="row-inline" style="justify-content: space-between; margin-bottom: 10px;">
          <label class="label" for="cf-key" style="margin: 0;" data-i18n="ui.key"></label>
          <a href="https://console.curseforge.com/" data-external data-i18n="ui.key_how"></a>
        </div>
        <p class="key-status" id="key-status"></p>
        <div class="row-inline">
          <input class="input key" id="cf-key" type="password" autocomplete="off" spellcheck="false">
          <button class="btn-small" type="button" id="btn-test" data-i18n="ui.key_test"></button>
          <button class="btn-small" type="button" id="btn-forget" hidden data-i18n="ui.key_forget"></button>
        </div>
        <p class="help" id="key-help" aria-live="polite"></p>
        <p class="help" data-i18n="ui.key_storage"></p>
      </div>
      <div class="field" id="advanced" hidden>
        <span class="label" data-i18n="ui.updates_section"></span>
        <label class="toggle"><input type="checkbox" id="allow-beta"> <span data-i18n="ui.allow_beta"></span></label>
        <div class="row-inline" style="margin-top: 14px;">
          <label for="backups" data-i18n="ui.backups"></label>
          <input class="input version" id="backups" type="number" min="1" max="20" style="width: 80px;">
        </div>
        <p class="help" data-i18n="ui.backups_help"></p>
        <div class="row-inline backup-actions">
          <button class="btn-small" type="button" id="btn-undo-last" data-i18n="ui.undo_last"></button>
          <button class="btn-small" type="button" id="btn-clear-backups" data-i18n="ui.clear_backups"></button>
        </div>
        <p class="help" id="backups-help" aria-live="polite"></p>
      </div>
      <div class="field" id="language-field">
        <label class="label" for="language" data-i18n="ui.language"></label>
        <select class="select" id="language"></select>
      </div>
    </form>
    <div class="form-actions">
      <button class="btn-secondary" type="button" id="btn-nokey" data-i18n="ui.no_key"></button>
      <span class="note" id="nokey-note" data-i18n="ui.no_key_note"></span>
      <span class="grow"></span>
      <button class="btn-secondary" type="button" id="btn-cancel-settings" hidden data-i18n="ui.cancel"></button>
      <button class="btn-primary" type="button" id="btn-save"></button>
    </div>
  </section>

  <!-- ============================================ Escaneo -->
  <section class="screen" id="screen-scan" hidden>
    <div class="lede">
      <h2 data-i18n="ui.scan_title"></h2>
      <p data-i18n="ui.scan_deck"></p>
    </div>
    <p class="scan-label" id="scan-label" aria-live="polite"></p>
    <div class="progress" role="progressbar" data-i18n-aria-label="ui.scan_progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="scan-bar"><span></span></div>
    <ol class="steps" id="scan-steps">
      <li data-step="read"><span class="mark" aria-hidden="true"></span><span data-i18n="ui.step_read"></span></li>
      <li data-step="cf"><span class="mark" aria-hidden="true"></span><span class="step-cf"></span></li>
      <li data-step="mr"><span class="mark" aria-hidden="true"></span><span data-i18n="ui.step_mr"></span></li>
      <li data-step="deps"><span class="mark" aria-hidden="true"></span><span data-i18n="ui.step_deps"></span></li>
    </ol>
    <div class="error-box" id="scan-error" hidden>
      <p id="scan-error-text"></p>
      <button class="btn-primary" type="button" id="btn-retry" data-i18n="ui.retry"></button>
      <button class="btn-secondary" type="button" data-go-settings data-i18n="ui.open_settings"></button>
    </div>
  </section>

  <!-- ============================================ Actualización interrumpida -->
  <section class="screen" id="screen-recover" hidden>
    <div class="lede" aria-live="polite">
      <h2 id="recover-title" data-i18n="recover.title"></h2>
      <p id="recover-deck"></p>
    </div>
    <div class="done-actions">
      <button class="btn-primary" type="button" id="btn-restore" data-i18n="recover.restore"></button>
      <button class="btn-secondary" type="button" id="btn-recover-skip" data-i18n="recover.skip"></button>
    </div>
    <p class="help undo-help" id="recover-help" aria-live="polite"></p>
  </section>

  <!-- ============================================ Resultados -->
  <section class="screen" id="screen-results" hidden>
    <div class="lede" aria-live="polite">
      <h2 id="headline"></h2>
      <p id="deck"></p>
      <ul class="notices" id="notices"></ul>
    </div>
    <div class="toolbar">
      <div class="segmented" role="group" data-i18n-aria-label="ui.filter_label" id="filters"></div>
      <label class="search">
        <span class="sr-only" data-i18n="ui.search"></span>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M7 1.5a5.5 5.5 0 0 1 4.38 8.82l3.15 3.15-1.06 1.06-3.15-3.15A5.5 5.5 0 1 1 7 1.5Zm0 1.5a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/></svg>
        <input id="q" type="search" autocomplete="off" aria-keyshortcuts="/" data-i18n-placeholder="ui.search">
        <kbd class="key-hint" aria-hidden="true">/</kbd>
      </label>
    </div>
    <main class="list" id="list" data-i18n-aria-label="ui.list_label"></main>
    <details class="details" id="details" hidden>
      <summary id="details-summary"></summary>
      <ul id="details-list"></ul>
    </details>
  </section>

  <!-- ============================================ Análisis -->
  <section class="screen" id="screen-analysis" hidden>
    <div class="lede">
      <h2 id="an-title"></h2>
      <p id="an-deck"></p>
    </div>
    <div class="an-empty" id="an-empty" hidden>
      <button class="btn-primary" type="button" id="an-go-scan" data-i18n="an.empty_go"></button>
    </div>
    <div id="an-body" hidden>
      <div class="an-cards" id="an-cards"></div>

      <section class="panel an-chart" aria-labelledby="an-chart-title">
        <div class="an-chart-head">
          <h3 id="an-chart-title" data-i18n="an.chart_title"></h3>
          <span class="spacer"></span>
          <label class="toggle"><input type="checkbox" id="an-libs"> <span data-i18n="an.include_libs"></span></label>
          <button class="btn-small" type="button" id="an-table-btn" aria-controls="an-table" aria-expanded="false" data-i18n="an.as_table"></button>
        </div>
        <div id="an-chart"></div>
        <div class="an-detail" id="an-detail" aria-live="polite"></div>
        <div class="sr-only" id="an-table">
        <table class="an-table">
          <caption data-i18n="an.chart_title"></caption>
          <thead><tr><th scope="col" data-i18n="an.table_cat"></th><th scope="col" data-i18n="an.table_count"></th><th scope="col" data-i18n="an.table_mods"></th></tr></thead>
          <tbody id="an-table-body"></tbody>
        </table>
        </div>
      </section>

      <div class="an-grid">
        <section class="panel an-box" aria-labelledby="an-heavy-title">
          <h3 id="an-heavy-title" data-i18n="an.heaviest"></h3>
          <ol class="an-list" id="an-heavy"></ol>
        </section>
        <section class="panel an-box" aria-labelledby="an-sides-title">
          <h3 id="an-sides-title" data-i18n="an.sides"></h3>
          <ul class="an-list" id="an-sides"></ul>
          <p class="an-hint" data-i18n="an.sides_hint"></p>
        </section>
        <section class="panel an-box" aria-labelledby="an-stale-title">
          <h3 id="an-stale-title" data-i18n="an.stale"></h3>
          <div id="an-stale"></div>
        </section>
        <section class="panel an-box" aria-labelledby="an-orphans-title">
          <h3 id="an-orphans-title" data-i18n="an.orphans"></h3>
          <p class="an-hint" data-i18n="an.orphans_hint"></p>
          <ul class="an-list" id="an-orphans"></ul>
        </section>
      </div>
    </div>
  </section>

  <!-- ============================================ Explorar -->
  <section class="screen" id="screen-explore" hidden>
    <div class="lede">
      <h2 data-i18n="ex.title"></h2>
      <p id="ex-deck"></p>
    </div>
    <form class="ex-bar" id="ex-form" role="search" onsubmit="return false">
      <label class="search ex-search">
        <span class="sr-only" data-i18n="ex.search"></span>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M7 1.5a5.5 5.5 0 0 1 4.38 8.82l3.15 3.15-1.06 1.06-3.15-3.15A5.5 5.5 0 1 1 7 1.5Zm0 1.5a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/></svg>
        <input id="ex-q" type="search" autocomplete="off" data-i18n-placeholder="ex.search_placeholder">
      </label>
      <label class="ex-field"><span data-i18n="ex.category"></span><select class="select" id="ex-cat"></select></label>
      <label class="ex-field"><span data-i18n="ex.sort"></span>
        <select class="select" id="ex-sort">
          <option value="popular" data-i18n="ex.sort_popular"></option>
          <option value="downloads" data-i18n="ex.sort_downloads"></option>
          <option value="updated" data-i18n="ex.sort_updated"></option>
          <option value="name" data-i18n="ex.sort_name"></option>
        </select>
      </label>
      <label class="toggle ex-hide"><input type="checkbox" id="ex-hide"> <span data-i18n="ex.hide_installed"></span></label>
    </form>
    <p class="ex-status" id="ex-status" aria-live="polite"></p>
    <div class="ex-grid" id="ex-results"></div>
    <div class="ex-more"><button class="btn-secondary" type="button" id="ex-more" hidden data-i18n="ex.load_more"></button></div>
  </section>

  <!-- ============================================ Actualizando -->
  <section class="screen" id="screen-apply" hidden>
    <div class="lede">
      <h2 data-i18n="ui.apply_title"></h2>
      <p data-i18n="ui.apply_deck"></p>
    </div>
    <p class="scan-label" id="apply-label" aria-live="polite"></p>
    <div class="progress" role="progressbar" data-i18n-aria-label="ui.apply_progress_label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="apply-bar"><span></span></div>
    <main class="list" id="apply-list" data-i18n-aria-label="ui.list_label"></main>
  </section>

  <!-- ============================================ Final -->
  <section class="screen" id="screen-done" hidden>
    <div class="lede" aria-live="polite">
      <h2 id="done-title"></h2>
      <p id="done-deck"></p>
    </div>
    <div class="done-actions">
      <button class="btn-primary" type="button" id="btn-open-folder" data-i18n="ui.open_folder"></button>
      <button class="btn-secondary" type="button" id="btn-undo" data-i18n="ui.undo"></button>
      <button class="btn-secondary" type="button" id="btn-check-again" data-i18n="ui.check_again"></button>
    </div>
    <p class="help undo-help" id="undo-help" aria-live="polite"></p>
    <div class="failed" id="done-failed" hidden>
      <h3 id="done-failed-title"></h3>
      <ul id="done-failed-list"></ul>
    </div>
  </section>
</div>

<div class="actionbar" role="region" data-i18n-aria-label="ui.update_region" id="actionbar" hidden>
  <div class="summary" id="summary" aria-live="polite"></div>
  <button class="btn-primary" type="button" id="go" aria-keyshortcuts="Control+Enter" data-i18n-title="ui.go_shortcut"></button>
  <button class="btn-primary" type="button" id="btn-recheck" hidden data-i18n="ui.check_again"></button>
</div>

<!-- Cesta de Explorar -->
<div class="actionbar ex-basket" role="region" data-i18n-aria-label="ex.basket_region" id="ex-basket" hidden>
  <div class="summary">
    <span class="count" id="ex-basket-count"></span>
    <ul class="ex-basket-list" id="ex-basket-list"></ul>
  </div>
  <button class="btn-secondary" type="button" id="ex-basket-clear" data-i18n="ex.basket_clear"></button>
  <button class="btn-primary" type="button" id="ex-basket-go" data-i18n="ex.basket_go"></button>
</div>

<!-- Explorar: detalle de un mod y revisión de la cesta (diálogo modal) -->
<div class="drawer-backdrop" id="ex-backdrop" hidden></div>
<aside class="drawer" id="ex-drawer" role="dialog" aria-modal="true" aria-labelledby="ex-d-title" hidden>
  <header class="drawer-head">
    <span class="ex-d-icon" id="ex-d-icon" hidden></span>
    <div>
      <h2 id="ex-d-title"></h2>
      <p id="ex-d-sub"></p>
    </div>
    <button class="navbtn drawer-close" type="button" id="ex-d-close" data-i18n-aria-label="cl.close">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.7 2.6 8 6.9l4.3-4.3 1.1 1.1L9.1 8l4.3 4.3-1.1 1.1L8 9.1l-4.3 4.3-1.1-1.1L6.9 8 2.6 3.7z"/></svg>
    </button>
  </header>
  <div class="drawer-body" id="ex-d-body" aria-live="polite"></div>
  <footer class="drawer-foot" id="ex-d-foot"></footer>
</aside>

<!-- Changelog: panel lateral (diálogo modal) -->
<div class="drawer-backdrop" id="cl-backdrop" hidden></div>
<aside class="drawer" id="cl-drawer" role="dialog" aria-modal="true" aria-labelledby="cl-title" hidden>
  <header class="drawer-head">
    <div>
      <h2 id="cl-title"></h2>
      <p id="cl-range"></p>
    </div>
    <button class="navbtn drawer-close" type="button" id="cl-close" data-i18n-aria-label="cl.close">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.7 2.6 8 6.9l4.3-4.3 1.1 1.1L9.1 8l4.3 4.3-1.1 1.1L8 9.1l-4.3 4.3-1.1-1.1L6.9 8 2.6 3.7z"/></svg>
    </button>
  </header>
  <div class="drawer-body" id="cl-body" aria-live="polite"></div>
</aside>

<script src="cat-icons.js"></script>
<script src="chart.js"></script>
<script src="app.js"></script>
</body>
</html>
