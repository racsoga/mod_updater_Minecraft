<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mod Updater</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- Los textos se rellenan desde locales/<idioma>.json: data-i18n (texto), data-i18n-placeholder,
     data-i18n-title, data-i18n-aria-label. -->
<div class="app">
  <header class="topbar">
    <h1 class="brand">Mod Updater</h1>
    <span class="spacer"></span>
    <span class="chip hide-sm" id="chip-folder" hidden></span>
    <span class="chip" id="chip-env" hidden></span>
    <button class="navbtn" type="button" id="btn-rescan" hidden data-i18n-aria-label="ui.rescan">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2a6 6 0 1 0 5.66 8h-1.6A4.5 4.5 0 1 1 8 3.5c1.24 0 2.37.5 3.18 1.32L9 7h5V2l-1.76 1.76A5.98 5.98 0 0 0 8 2Z"/></svg>
      <span class="label" data-i18n="ui.rescan"></span>
    </button>
    <button class="navbtn" type="button" id="btn-settings" hidden data-i18n="ui.settings"></button>
  </header>

  <!-- ============================================ Bienvenida / Ajustes -->
  <section class="screen" id="screen-setup" hidden>
    <div class="lede">
      <h2 id="setup-title"></h2>
      <p id="setup-deck"></p>
    </div>
    <form class="panel" id="setup-form" novalidate>
      <div class="field">
        <span class="label" id="lbl-folder" data-i18n="ui.folder"></span>
        <div class="row-inline">
          <span class="path" id="folder-path" aria-labelledby="lbl-folder"></span>
          <button class="btn-small" type="button" id="btn-folder" data-i18n="ui.change_folder"></button>
        </div>
        <p class="help" id="folder-help" aria-live="polite"></p>
      </div>
      <div class="field">
        <div class="pair">
          <div>
            <label class="label" for="mc-version" data-i18n="ui.mc_version"></label>
            <select class="select" id="mc-version"></select>
          </div>
          <div>
            <label class="label" for="loader" data-i18n="ui.loader"></label>
            <select class="select" id="loader"></select>
          </div>
        </div>
        <p class="help" id="env-help"></p>
      </div>
      <div class="field">
        <div class="row-inline" style="justify-content: space-between; margin-bottom: 10px;">
          <label class="label" for="cf-key" style="margin: 0;" data-i18n="ui.key"></label>
          <a href="https://console.curseforge.com/" data-external data-i18n="ui.key_how"></a>
        </div>
        <p class="key-status" id="key-status"></p>
        <div class="row-inline">
          <input class="input key" id="cf-key" type="password" autocomplete="off" spellcheck="false">
          <button class="btn-small" type="button" id="btn-test" data-i18n="ui.key_test"></button>
          <button class="btn-small" type="button" id="btn-forget" hidden data-i18n="ui.key_forget"></button>
        </div>
        <p class="help" id="key-help" aria-live="polite"></p>
        <p class="help" data-i18n="ui.key_storage"></p>
      </div>
      <div class="field" id="advanced" hidden>
        <span class="label" data-i18n="ui.updates_section"></span>
        <label class="toggle"><input type="checkbox" id="allow-beta"> <span data-i18n="ui.allow_beta"></span></label>
        <div class="row-inline" style="margin-top: 14px;">
          <label for="backups" data-i18n="ui.backups"></label>
          <input class="input version" id="backups" type="number" min="1" max="20" style="width: 80px;">
        </div>
        <p class="help" data-i18n="ui.backups_help"></p>
        <div class="row-inline backup-actions">
          <button class="btn-small" type="button" id="btn-undo-last" data-i18n="ui.undo_last"></button>
          <button class="btn-small" type="button" id="btn-clear-backups" data-i18n="ui.clear_backups"></button>
        </div>
        <p class="help" id="backups-help" aria-live="polite"></p>
      </div>
      <div class="field" id="language-field">
        <label class="label" for="language" data-i18n="ui.language"></label>
        <select class="select" id="language"></select>
      </div>
    </form>
    <div class="form-actions">
      <button class="btn-secondary" type="button" id="btn-nokey" data-i18n="ui.no_key"></button>
      <span class="note" id="nokey-note" data-i18n="ui.no_key_note"></span>
      <span class="grow"></span>
      <button class="btn-secondary" type="button" id="btn-cancel-settings" hidden data-i18n="ui.cancel"></button>
      <button class="btn-primary" type="button" id="btn-save"></button>
    </div>
  </section>

  <!-- ============================================ Escaneo -->
  <section class="screen" id="screen-scan" hidden>
    <div class="lede">
      <h2 data-i18n="ui.scan_title"></h2>
      <p data-i18n="ui.scan_deck"></p>
    </div>
    <p class="scan-label" id="scan-label" aria-live="polite"></p>
    <div class="progress" role="progressbar" data-i18n-aria-label="ui.scan_progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="scan-bar"><span></span></div>
    <ol class="steps" id="scan-steps">
      <li data-step="read"><span class="mark" aria-hidden="true"></span><span data-i18n="ui.step_read"></span></li>
      <li data-step="cf"><span class="mark" aria-hidden="true"></span><span class="step-cf"></span></li>
      <li data-step="mr"><span class="mark" aria-hidden="true"></span><span data-i18n="ui.step_mr"></span></li>
      <li data-step="deps"><span class="mark" aria-hidden="true"></span><span data-i18n="ui.step_deps"></span></li>
    </ol>
    <div class="error-box" id="scan-error" hidden>
      <p id="scan-error-text"></p>
      <button class="btn-primary" type="button" id="btn-retry" data-i18n="ui.retry"></button>
      <button class="btn-secondary" type="button" data-go-settings data-i18n="ui.open_settings"></button>
    </div>
  </section>

  <!-- ============================================ Resultados -->
  <section class="screen" id="screen-results" hidden>
    <div class="lede" aria-live="polite">
      <h2 id="headline"></h2>
      <p id="deck"></p>
      <ul class="notices" id="notices"></ul>
    </div>
    <div class="toolbar">
      <div class="segmented" role="group" data-i18n-aria-label="ui.filter_label" id="filters"></div>
      <label class="search">
        <span class="sr-only" data-i18n="ui.search"></span>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M7 1.5a5.5 5.5 0 0 1 4.38 8.82l3.15 3.15-1.06 1.06-3.15-3.15A5.5 5.5 0 1 1 7 1.5Zm0 1.5a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/></svg>
        <input id="q" type="search" autocomplete="off" aria-keyshortcuts="/" data-i18n-placeholder="ui.search">
        <kbd class="key-hint" aria-hidden="true">/</kbd>
      </label>
    </div>
    <main class="list" id="list" data-i18n-aria-label="ui.list_label"></main>
    <details class="details" id="details" hidden>
      <summary id="details-summary"></summary>
      <ul id="details-list"></ul>
    </details>
  </section>

  <!-- ============================================ Actualizando -->
  <section class="screen" id="screen-apply" hidden>
    <div class="lede">
      <h2 data-i18n="ui.apply_title"></h2>
      <p data-i18n="ui.apply_deck"></p>
    </div>
    <p class="scan-label" id="apply-label" aria-live="polite"></p>
    <div class="progress" role="progressbar" data-i18n-aria-label="ui.apply_progress_label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="apply-bar"><span></span></div>
    <main class="list" id="apply-list" data-i18n-aria-label="ui.list_label"></main>
  </section>

  <!-- ============================================ Final -->
  <section class="screen" id="screen-done" hidden>
    <div class="lede" aria-live="polite">
      <h2 id="done-title"></h2>
      <p id="done-deck"></p>
    </div>
    <div class="done-actions">
      <button class="btn-primary" type="button" id="btn-open-folder" data-i18n="ui.open_folder"></button>
      <button class="btn-secondary" type="button" id="btn-undo" data-i18n="ui.undo"></button>
      <button class="btn-secondary" type="button" id="btn-check-again" data-i18n="ui.check_again"></button>
    </div>
    <p class="help undo-help" id="undo-help" aria-live="polite"></p>
    <div class="failed" id="done-failed" hidden>
      <h3 id="done-failed-title"></h3>
      <ul id="done-failed-list"></ul>
    </div>
  </section>
</div>

<div class="actionbar" role="region" data-i18n-aria-label="ui.update_region" id="actionbar" hidden>
  <div class="summary" id="summary" aria-live="polite"></div>
  <button class="btn-secondary" type="button" id="btn-quit" data-i18n="ui.close"></button>
  <button class="btn-primary" type="button" id="go" aria-keyshortcuts="Control+Enter" data-i18n-title="ui.go_shortcut"></button>
</div>

<script src="app.js"></script>
</body>
</html>
