name: Tests

# En cada push a cualquier rama y en cada pull request. Los tests no usan red ni ventana,
# así que corren en Linux (más rápido); el .exe se compila en Windows en el workflow de Release,
# que vuelve a pasar los tests allí antes de compilar.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# Si llega otro push a la misma rama (o PR) mientras se ejecuta, se cancela el anterior.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Dependencias
        run: python -m pip install -r requirements.txt
      - name: Tests (sin red, sin key)
        run: python -m pytest -q
