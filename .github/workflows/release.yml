name: Release

# Se ejecuta al subir una etiqueta vX.Y.Z (por ejemplo: git tag v0.2.0 && git push origin v0.2.0).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write  # para crear la Release y adjuntar el .exe

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Dependencias
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

      - name: La etiqueta coincide con la versión del código
        shell: pwsh
        run: |
          $code = python -c "import mod_updater; print(mod_updater.__version__)"
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($code -ne $tag) { throw "La etiqueta v$tag no coincide con mod_updater.__version__ ($code)" }

      - name: Compilar ModUpdater.exe (con icono)
        run: python -m PyInstaller packaging/ModUpdater.spec --noconfirm --distpath dist --workpath build

      - name: Resumen SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/ModUpdater.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ModUpdater.exe" | Out-File -Encoding ascii dist/ModUpdater.exe.sha256
          Get-Content dist/ModUpdater.exe.sha256

      - name: Notas de la versión (de CHANGELOG.md)
        run: python packaging/release_notes.py ${{ github.ref_name }} dist/ModUpdater.exe.sha256 > notas.md

      - name: Crear la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          dist/ModUpdater.exe dist/ModUpdater.exe.sha256
          --title "Mod Updater ${{ github.ref_name }}"
          --notes-file notas.md
