name: Release

# Se ejecuta al subir una etiqueta vX.Y.Z (por ejemplo: git tag v0.2.0 && git push origin v0.2.0).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write  # para crear la Release y adjuntar el .exe

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Dependencias
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

      - name: La etiqueta coincide con la versión del código
        shell: pwsh
        run: |
          $code = python -c "import mod_updater; print(mod_updater.__version__)"
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($code -ne $tag) { throw "La etiqueta v$tag no coincide con mod_updater.__version__ ($code)" }

      # build.ps1 reinstala PyInstaller compilando su cargador desde el código fuente (el runner
      # trae las Build Tools de Visual Studio), compila el .exe único y el zip en carpeta (ambos
      # con información de versión y sin UPX) y escribe sus SHA-256.
      - name: Compilar ModUpdater.exe y el zip en carpeta
        shell: pwsh
        run: ./packaging/build.ps1 -Python python

      - name: Notas de la versión (de CHANGELOG.md)
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new()  # la salida de Python es UTF-8
          $sums = Get-ChildItem dist/*.sha256 | Sort-Object Name -Descending | ForEach-Object FullName
          python packaging/release_notes.py ${{ github.ref_name }} @sums > notas.md
          Get-Content notas.md

      - name: Crear la Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-ChildItem dist -File | ForEach-Object FullName) `
            --title "Mod Updater ${{ github.ref_name }}" --notes-file notas.md
