name: Fallo (bug)
description: Algo no funciona como debería.
title: "[Fallo] "
labels: ["fallo"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisar. **No pegues nunca tu key de CurseForge** ni rutas con datos personales que no quieras compartir.
        *You can write in English too.*
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué ha pasado
      description: Qué hiciste, qué esperabas y qué ocurrió en su lugar.
      placeholder: "Pulsé Actualizar con 12 cambios y JEI quedó con error: …"
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abrir Mod Updater
        2. …
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Versión de Mod Updater
      description: Aparece en el nombre de la Release que descargaste.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: minecraft
    attributes:
      label: Minecraft y cargador de mods
      placeholder: "1.21.1 · NeoForge 21.1.x"
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows
      options:
        - Windows 11
        - Windows 10
        - Otro
    validations:
      required: true
  - type: textarea
    id: cambios
    attributes:
      label: cambios.txt (si el fallo fue al actualizar)
      description: Está en `.minecraft\mods_backup\<fecha>\cambios.txt`. Pega su contenido.
      render: text
    validations:
      required: false
  - type: textarea
    id: capturas
    attributes:
      label: Capturas
      description: Arrastra aquí capturas de pantalla si ayudan.
    validations:
      required: false
