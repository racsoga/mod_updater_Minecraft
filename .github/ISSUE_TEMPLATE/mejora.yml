name: Mejora (feature request)
description: Propón una función nueva o un cambio.
title: "[Mejora] "
labels: ["mejora"]
body:
  - type: markdown
    attributes:
      value: |
        Cuéntanos qué te gustaría que hiciera Mod Updater. *You can write in English too.*
  - type: textarea
    id: problema
    attributes:
      label: Qué problema resolvería
      description: Describe la situación en la que lo echas de menos.
      placeholder: "Tengo varias instancias de Minecraft y cada vez tengo que cambiar la carpeta…"
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: Qué propones
      placeholder: "Poder guardar varias carpetas y elegir una al abrir la app."
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas que has probado
    validations:
      required: false
