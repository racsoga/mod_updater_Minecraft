<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mod Updater · Resultados (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Silkscreen&display=swap" rel="stylesheet">
<style>
  /* Tokens: base apple.com-DESIGN.md + "Préstamos" (Notion: densidad; dope.security: estados) */
  :root {
    --stage: #000000;          /* Apple stage black */
    --panel: #161617;          /* Apple technical panel */
    --charcoal: #1d1d1f;       /* Apple chapter charcoal */
    --text: #f5f5f7;           /* Apple soft white */
    --muted: #86868b;          /* Apple narrative gray: texto secundario sobre fondos lisos */
    --muted-strong: #a1a1a6;   /* gris para texto sobre lavados (insignias): >= 4.5:1 */
    --label: #6e6e73;          /* Apple label gray: solo iconos, nunca texto */
    --edge: #333336;           /* Apple dark edge */
    --rule: rgba(255, 255, 255, 0.08);   /* Notion hairline, en oscuro */
    --hover: rgba(255, 255, 255, 0.04);  /* Notion hover wash, en oscuro */
    --frame: rgba(255, 255, 255, 0.14);  /* dope.security faint rule */
    --badge: rgba(255, 255, 255, 0.07);  /* dope.security technical badge */
    --accent: #0071e3;         /* Apple action blue: único acento */
    --accent-hover: #0076df;
    --accent-active: #006edb;
    --link: #2997ff;           /* Apple luminous blue */
    --accent-wash: rgba(0, 113, 227, 0.16);
    --warn: #ffb340;           /* semántico: puntos y texto de aviso, nunca fondo */
    --font: "Inter", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --pixel: "Silkscreen", "Inter", monospace;
  }

  * { box-sizing: border-box; }
  html { background: var(--stage); color-scheme: dark; scrollbar-gutter: stable; }
  body {
    margin: 0;
    background: var(--stage);
    color: var(--text);
    font: 400 15px/1.4 var(--font);
    font-feature-settings: "tnum" 1, "cv11" 1;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { max-width: 1120px; margin: 0 auto; padding: 0 32px 150px; }

  /* ------------------------------------------------ barra superior */
  .topbar {
    display: flex; align-items: center; gap: 12px;
    height: 64px; border-bottom: 1px solid var(--rule);
  }
  .brand {
    font-family: var(--pixel); font-size: 18px; letter-spacing: 0.02em;
    margin: 0; font-weight: 400; color: var(--text); white-space: nowrap;
  }
  .topbar .spacer { flex: 1; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 8px; line-height: 16px;
    background: var(--badge); color: var(--muted-strong); font-size: 13px;
    white-space: nowrap;
  }
  .chip strong { color: var(--text); font-weight: 500; }
  .navbtn {
    height: 32px; padding: 0 10px; border: 0; border-radius: 8px;
    background: transparent; color: var(--text); font-size: 14px; font-weight: 500;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }
  .navbtn:hover { background: var(--hover); }
  .navbtn svg { width: 16px; height: 16px; fill: currentColor; }

  /* ------------------------------------------------ cabecera */
  .lede { padding: 48px 0 28px; max-width: 760px; }
  .lede h2 {
    margin: 0 0 12px; font-weight: 600; font-size: 40px; line-height: 1.1;
    letter-spacing: -0.012em; text-wrap: balance;
  }
  .lede p { margin: 0; font-size: 19px; line-height: 1.4; color: var(--muted); letter-spacing: 0.005em; }
  .lede p b { color: var(--text); font-weight: 500; }

  /* ------------------------------------------------ filtros (selector de dope.security, en azul) */
  .toolbar { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
  .segmented {
    display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 4px; border-radius: 22px;
    background: var(--charcoal); border: 1px solid var(--rule);
  }
  .segmented button {
    height: 32px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent;
    color: var(--muted-strong); font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background-color 100ms linear, color 100ms linear;
  }
  .segmented button:hover { color: var(--text); }
  .segmented button[aria-pressed="true"] { background: var(--text); color: #000; }
  .segmented .n { font-weight: 400; }
  .search { margin-left: auto; position: relative; width: 240px; }
  .search input {
    width: 100%; height: 36px; padding: 0 12px 0 34px; border-radius: 8px;
    background: var(--charcoal); border: 1px solid var(--rule); font-size: 14px;
  }
  .search input::placeholder { color: var(--muted-strong); }
  .search svg { position: absolute; left: 11px; top: 10px; width: 16px; height: 16px; fill: var(--label); }
  kbd {
    font: inherit; font-size: 12px; color: var(--muted-strong); padding: 0 5px; border-radius: 4px;
    border: 1px solid var(--rule);
  }

  /* ------------------------------------------------ lista */
  .list {
    background: var(--panel); border: 1px solid var(--frame); border-radius: 28px;
    padding: 8px 0 12px;
  }
  .group-head {
    display: flex; align-items: center; gap: 12px;
    padding: 20px 28px 8px;
  }
  .group-head h3 { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); }
  .group-head .count { font-size: 13px; color: var(--muted); }
  .group-head .grow { flex: 1; }
  .master { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted-strong); cursor: pointer; }
  .linkbtn {
    border: 0; background: none; padding: 4px 6px; border-radius: 6px; cursor: pointer;
    color: var(--link); font-size: 13px; font-weight: 500;
  }
  .linkbtn:hover { text-decoration: underline; }

  .row {
    display: grid; align-items: center;
    grid-template-columns: 20px 32px minmax(180px, 1fr) minmax(0, 300px) 152px 96px;
    column-gap: 16px; min-height: 56px; padding: 8px 28px;
    border-top: 1px solid var(--rule);
  }
  .group-head + .row { border-top-color: transparent; }
  .row:hover { background: var(--hover); }

  .check { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; cursor: pointer; }
  .slot { width: 18px; height: 18px; }   /* hueco donde no hay casilla: menos ruido que una deshabilitada */

  .logo {
    width: 32px; height: 32px; border-radius: 8px; object-fit: cover; display: block;
    background: var(--charcoal);
  }
  .logo.mono {
    display: grid; place-items: center; font-size: 13px; font-weight: 600; color: var(--muted-strong);
    border: 1px solid var(--rule);
  }
  .name { min-width: 0; }
  .name .title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name .sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name .sub.warn { color: var(--warn); white-space: normal; }

  .ver { display: flex; align-items: center; gap: 8px; font-size: 14px; min-width: 0; }
  .ver .old { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .ver .new { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .ver svg { flex: none; width: 12px; height: 12px; fill: var(--label); }
  .tag {
    flex: none; font-size: 11px; color: var(--muted-strong); padding: 1px 6px; border-radius: 6px;
    background: var(--badge);
  }

  /* insignias de estado: "technical badge" de dope.security */
  .badge {
    position: relative; justify-self: start;
    display: inline-flex; align-items: center; gap: 7px;
    height: 26px; padding: 0 10px; border-radius: 8px;
    background: var(--badge); border-top: 0.5px solid rgba(255, 255, 255, 0.18);
    font-size: 12.5px; font-weight: 500; color: var(--muted-strong); white-space: nowrap; cursor: default;
  }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  /* el azul se reserva para la acción y para lo nuevo: "Actualizable" es neutro con un punto azul */
  .badge.up { color: var(--text); }
  .badge.up .dot { background: var(--link); }
  .badge.dep { background: var(--accent-wash); color: var(--link); border-top-color: rgba(41, 151, 255, 0.4); }
  .badge.manual .dot { background: var(--warn); }
  .badge.missing .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted-strong); }

  /* explicación del estado al pasar el ratón (para lector de pantalla va en .sr-only dentro) */
  .badge[data-tip]::after {
    content: attr(data-tip);
    position: absolute; left: 0; bottom: calc(100% + 8px); z-index: 5;
    width: max-content; max-width: 260px; white-space: normal;
    padding: 8px 10px; border-radius: 8px;
    background: #2c2c2e; color: var(--text); font-size: 13px; font-weight: 400; line-height: 1.35;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08);
    display: none;
  }
  .badge[data-tip]:hover::after { display: block; }

  .source { font-size: 13px; color: var(--muted); }
  .source a { color: var(--link); text-decoration: none; font-weight: 500; }
  .source a:hover { text-decoration: underline; }

  .empty { padding: 32px 28px; color: var(--muted); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

  /* ------------------------------------------------ barra de acciones: "local glass" de Apple */
  .actionbar {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    width: min(1056px, calc(100% - 32px));
    display: flex; align-items: center; gap: 16px;
    padding: 14px 14px 14px 24px; border-radius: 18px;
    background: rgba(29, 29, 31, 0.82);
    backdrop-filter: saturate(1.6) blur(20px); -webkit-backdrop-filter: saturate(1.6) blur(20px);
    box-shadow: 0 0 0 1px rgb(48, 48, 50);
  }
  .actionbar .summary { flex: 1; min-width: 0; }
  .summary .count { font-weight: 600; }
  .summary .safe { display: block; margin-top: 2px; font-size: 14px; color: var(--text); }
  .summary .safe::before {
    content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--link); margin-right: 8px; vertical-align: 2px;
  }
  .summary .warn { display: block; margin-top: 2px; font-size: 14px; color: var(--warn); }
  .btn-secondary {
    height: 44px; padding: 0 18px; border-radius: 999px; border: 0; cursor: pointer;
    background: transparent; color: var(--text); font-size: 15px; white-space: nowrap;
  }
  .btn-secondary:hover { background: rgba(255, 255, 255, 0.06); }
  .btn-primary {
    height: 44px; padding: 11px 22px; border-radius: 980px; border: 1px solid transparent; cursor: pointer;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 500; white-space: nowrap;
    transition: background-color 100ms linear;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:active { background: var(--accent-active); }
  .btn-primary:focus-visible { outline-offset: 3px; }
  .btn-primary:disabled { background: var(--edge); color: var(--muted-strong); cursor: default; }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ------------------------------------------------ ventanas estrechas */
  @media (max-width: 860px) {
    .app { padding: 0 16px 200px; }
    .lede { padding-top: 32px; }
    .lede h2 { font-size: 30px; }
    .lede p { font-size: 17px; }
    .topbar { gap: 8px; }
    .topbar .chip.hide-sm, .navbtn .label, .chip .label { display: none; }
    .brand { font-size: 16px; }
    .search { margin-left: 0; width: 100%; }
    .search kbd { display: none; }
    /* fila en tres líneas: nombre; versiones; estado (+ enlace si hace falta) */
    .row { grid-template-columns: 20px 32px minmax(0, 1fr) auto; row-gap: 6px; padding: 10px 16px; }
    .row .name { grid-column: 3 / 5; }
    .row .ver { grid-column: 3 / 5; grid-row: 2; }
    .row .badge { grid-column: 3; grid-row: 3; }
    .row .source { grid-column: 4; grid-row: 3; }
    .row:not(.manual) .source { display: none; }
    .group-head { padding: 18px 16px 6px; }
    .list { border-radius: 20px; }
    .actionbar { flex-wrap: wrap; padding: 14px 16px; gap: 8px; }
    .actionbar .summary { flex-basis: 100%; }
    .actionbar .btn-primary { flex: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

</div>

<div class="actionbar" role="region" aria-label="Actualizar">

</div>

    ["Dis-Enchanting Table", "5.0.2"], ["Easy Magic", "21.1.4"], ["ElevatorMod", "1.11.4"], ["Enchanting Infuser", "21.1.4"],
    ["Enderman Overhaul", "2.0.3"], ["FallingTree", "1.21.1.11"], ["Farmer's Delight", "1.3.4"], ["FerriteCore", "7.0.3"],
    ["Iceberg", "1.3.2"], ["ImmediatelyFast", "1.6.15"], ["Improvable Skills", "21.0.2"], ["Incendium Legacy", "5.4.4"],
    ["Iris & Oculus Flywheel Compat", "2.4.0"], ["Iris Shaders", "1.8.14-beta.1"], ["Jade", "15.10.6"], ["JamLib", "1.3.6"],
    ["Jump Over Fences", "1.6.1"], ["Just Enough Items (JEI)", "19.71.0.475"], ["Konkrete", "1.9.9"], ["Legendary Tooltips", "1.5.5"],
    ["Luki's Grand Capitals", "1.1.3"], ["MekaJadeUpgrades", "1.3"], ["Mekanism", "10.7.19.85"], ["Mekanism Additions", "10.7.19.85"],
    ["Mekanism Generators", "10.7.19.85"], ["Mekanism Tools", "10.7.19.85"], ["Mekanism: Enchantable MekaSuit", "1.0.3"],
    ["Moonlight Lib", "3.8.3"], ["Mouse Tweaks", "2.26.1"], ["Mowzie's Mobs", "1.8.2"], ["Polymorph", "1.1.0"], ["Prickle", "21.1.11"],
    ["Prism", "1.0.11"], ["Realm RPG: Fallen Adventurers", "1.1.0"], ["Resourceful Config", "3.0.11"], ["Resourceful Lib", "3.0.12"],
    ["Smarter Farmers", "2.2.4"], ["Sodium", "0.8.13"], ["Sophisticated Core", "1.5.39"], ["Sparkweave Engine", "0.510.0"],
    ["Supplementaries", "4.1.3"], ["The Twilight Forest", "4.8.3345"], ["TrashSlot", "21.1.11"], ["Waystones", "21.1.47"],
    ["When Dungeons Arise", "2.1.68"], ["When Dungeons Arise: Seven Seas", "1.0.4"], ["Xaero's Minimap", "26.6.0"],
    ["Xaero's World Map", "1.47.0"], ["YetAnotherConfigLib", "3.8.2"],
  ].map(([name, from]) => ({ s: "ok", name, from, src: "CurseForge" })),
];
MODS.forEach((m, i) => { m.id = i; m.checked = m.s === "up" || m.s === "dep"; });
const byName = Object.fromEntries(MODS.map(m => [m.name, m]));

const selectable = m => m.s === "up" || m.s === "dep";
const isAttention = m => m.s === "manual" || m.s === "missing";
const GROUPS = [
  { key: "attention", title: "Requieren atención", match: isAttention },
  { key: "updates", title: "Actualizaciones", match: selectable },
  { key: "ok", title: "Al día", match: m => m.s === "ok", collapsible: true },
];
const FILTERS = [
  { key: "all", label: "Todos", match: () => true },
  { key: "updates", label: "Actualizaciones", match: selectable },
  { key: "ok", label: "Al día", match: m => m.s === "ok" },
  { key: "attention", label: "Requieren atención", match: isAttention },
];
const BADGE = {
  up: ["up", "Actualizable"], ok: ["ok", "Al día"], manual: ["manual", "Descarga manual"],
  missing: ["missing", "No encontrado"], dep: ["dep", "Nueva dependencia"],
};

let filter = "all", query = "", okOpen = false;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const arrow = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4.2 1.8 8.4 6l-4.2 4.2-1-1L6.4 6 3.2 2.8z"/></svg>';
const plural = (n, one, many) => (n === 1 ? one : many);
const list = names => names.length < 2 ? names.join("") : names.slice(0, -1).join(", ") + " y " + names.at(-1);

/* --- dependencias: una dependencia está atada a quien la necesita (P0) --- */
function depsBrokenBy(m) {
  // Mods que quedarían sin su dependencia si `m` (dependencia) no se instala.
  return m.s === "dep" && !m.checked ? m.neededBy : [];
}
function setChecked(m, value) {
  m.checked = value;
  // Si un mod que se actualiza necesita esta dependencia, van juntos.
  for (const other of MODS) {
    if (other.s === "dep" && other.neededBy.includes(m.name) && value) other.checked = true;
  }
  if (m.s === "dep" && !value) {
    for (const parent of m.neededBy.map(n => byName[n]).filter(p => p && p.s === "up")) parent.checked = false;
  }
}

function logo(m) {
  const path = LOGOS[m.name];
  if (path) return `<img class="logo" src="${CDN + path}" alt="" loading="lazy" width="32" height="32">`;
  const letter = m.name.replace(/[^\p{L}\p{N}]/gu, "").charAt(0).toUpperCase() || "?";
  return `<span class="logo mono" aria-hidden="true">${esc(letter)}</span>`;
}

function versions(m) {
  const beta = m.beta ? '<span class="tag">beta</span>' : "";
  if (m.s === "ok" || m.s === "missing") return `<div class="ver"><span class="new" title="${esc(m.from)}">${esc(m.from)}</span></div>`;
  const from = m.from ? `<span class="old" title="${esc(m.from)}">${esc(m.from)}</span>` : `<span class="old">Sin instalar</span>`;
  return `<div class="ver">${from}${arrow}<span class="sr-only">a</span><span class="new" title="${esc(m.to)}">${esc(m.to)}</span>${beta}</div>`;
}

function sub(m) {
  if (m.s === "dep") {
    const broken = depsBrokenBy(m);
    if (broken.length) return `<div class="sub warn">Sin ${esc(m.name)}, ${esc(list(broken))} no arrancará.</div>`;
    return `<div class="sub">La necesita ${esc(list(m.neededBy))}</div>`;
  }
  if (m.s === "manual") return `<div class="sub">El autor no permite descargarlo desde aquí</div>`;
  return m.sub ? `<div class="sub">${esc(m.sub)}</div>` : "";
}

function row(m) {
  const [cls, label] = BADGE[m.s];
  const helpId = `help-${m.id}`;
  const cb = selectable(m)
    ? `<input class="check" type="checkbox" data-id="${m.id}" ${m.checked ? "checked" : ""} aria-label="${m.s === "dep" ? "Instalar" : "Actualizar"} ${esc(m.name)}" aria-describedby="${helpId}">`
    : `<span class="slot" aria-hidden="true"></span>`;
  const source = m.page ? `<a href="#" onclick="return false">Abrir página</a>` : (m.src ? esc(m.src) : "");
  return `<div class="row ${cls}">
    ${cb}${logo(m)}
    <div class="name"><div class="title">${esc(m.name)}</div>${sub(m)}</div>
    ${versions(m)}
    <span class="badge ${cls}" data-tip="${esc(HELP[m.s])}"><span class="dot" aria-hidden="true"></span>${label}<span class="sr-only" id="${helpId}">. ${esc(HELP[m.s])}</span></span>
    <span class="source">${source}</span>
  </div>`;
}

function visible(m) {
  const f = FILTERS.find(f => f.key === filter);
  return f.match(m) && (!query || m.name.toLowerCase().includes(query));
}

function render() {
  // Recordar qué control tenía el foco para devolvérselo tras redibujar (P1 teclado).
  const a = document.activeElement;
  const focusKey = a && a.dataset ? (a.dataset.f && `[data-f="${a.dataset.f}"]`) || (a.dataset.id && `[data-id="${a.dataset.id}"]`)
    || ("ok" in a.dataset && "[data-ok]") || ("all" in a.dataset && "[data-all]") || ("clear" in a.dataset && "#q") : null;

  document.getElementById("filters").innerHTML = FILTERS.map(f => {
    const n = MODS.filter(f.match).length;
    return `<button type="button" data-f="${f.key}" aria-pressed="${f.key === filter}">${f.label} <span class="n">${n}</span></button>`;
  }).join("");

  let html = "";
  for (const g of GROUPS) {
    const items = MODS.filter(m => g.match(m) && visible(m));
    if (!items.length) continue;
    const forced = filter === "ok" || query;
    const open = !g.collapsible || okOpen || forced;
    let extra = "";
    if (g.key === "updates") {
      const n = items.filter(m => m.checked).length;
      extra = `<label class="master"><input class="check" type="checkbox" data-all ${n === items.length ? "checked" : ""}> Todas</label>`;
    } else if (g.collapsible && !forced) {
      extra = `<button class="linkbtn" type="button" data-ok aria-expanded="${okOpen}">${okOpen ? "Ocultar" : `Mostrar ${items.length}`}</button>`;
    }
    html += `<div class="group-head"><h3>${g.title}</h3><span class="count">${items.length}</span><span class="grow"></span>${extra}</div>`;
    if (open) html += items.map(row).join("");
  }
  document.getElementById("list").innerHTML = html ||
    `<div class="empty">Ningún mod coincide con “${esc(query)}”. <button class="linkbtn" type="button" data-clear>Borrar búsqueda</button></div>`;

  const master = document.querySelector("[data-all]");
  if (master) {
    const items = MODS.filter(m => selectable(m) && visible(m));
    const n = items.filter(m => m.checked).length;
    master.indeterminate = n > 0 && n < items.length;
  }
  if (focusKey) document.querySelector(focusKey)?.focus();
  summary();
}

function summary() {
  const ups = MODS.filter(m => m.s === "up"), deps = MODS.filter(m => m.s === "dep");
  const okN = MODS.filter(m => m.s === "ok").length, attN = MODS.filter(isAttention).length;

  // Una sola fuente para todas las cifras (P2): N mods + M dependencias = N+M cambios.
  let head = `${ups.length} ${plural(ups.length, "mod tiene", "mods tienen")} versión nueva`;
  if (deps.length) head += ` y ${plural(deps.length, "falta 1 dependencia", `faltan ${deps.length} dependencias`)}`;
  document.getElementById("headline").textContent = head + ".";
  const depLines = deps.map(d => `${d.name} hace falta para ${list(d.neededBy)}.`).join(" ");
  document.getElementById("deck").innerHTML =
    `<b>${okN} ya están al día.</b> ${attN ? `${attN} ${plural(attN, "necesita", "necesitan")} que hagas algo. ` : ""}${esc(depLines)}`;

  const sel = MODS.filter(m => m.checked);
  const selUp = sel.filter(m => m.s === "up").length, selDep = sel.filter(m => m.s === "dep").length;
  const btn = document.getElementById("go");
  btn.disabled = sel.length === 0;
  btn.textContent = !sel.length ? "Elige algún mod"
    : selDep && selUp ? `Actualizar ${selUp} e instalar ${selDep}`
    : selDep ? `Instalar ${selDep} ${plural(selDep, "dependencia", "dependencias")}`
    : `Actualizar ${selUp} ${plural(selUp, "mod", "mods")}`;

  const broken = deps.flatMap(depsBrokenBy);
  const warn = broken.length
    ? `<span class="warn">Sin ${esc(list(deps.filter(d => !d.checked).map(d => d.name)))}, ${esc(list(broken))} no arrancará.</span>` : "";
  document.getElementById("summary").innerHTML =
    `<span class="count">${sel.length} de ${ups.length + deps.length} cambios seleccionados</span>` +
    (warn || `<span class="safe">Antes de cambiar nada se guarda una copia de tus mods. Podrás deshacerlo al terminar.</span>`);
}

document.addEventListener("click", e => {
  const f = e.target.closest("[data-f]");
  if (f) { filter = f.dataset.f; render(); return; }
  if (e.target.closest("[data-ok]")) { okOpen = !okOpen; render(); return; }
  if (e.target.closest("[data-clear]")) { const q = document.getElementById("q"); q.value = ""; query = ""; render(); q.focus(); return; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if ("all" in t.dataset) {
    const items = MODS.filter(m => selectable(m) && visible(m));
    items.forEach(m => setChecked(m, t.checked));
    render(); return;
  }
  if (t.dataset.id !== undefined) { setChecked(MODS[t.dataset.id], t.checked); render(); }
});
document.getElementById("q").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); render(); });
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); document.getElementById("q").focus(); }
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { const b = document.getElementById("go"); if (!b.disabled) b.click(); }
});

render();
</script>
</body>
</html>
